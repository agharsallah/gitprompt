name: Security audit

# New RustSec advisories are published against crates already in Cargo.lock, so a lockfile that
# passed CI yesterday can be vulnerable today. This job re-checks the unchanged lockfile against
# the latest advisory database every day.
#
# On a scheduled run rustsec/audit-check opens one GitHub issue per advisory: vulnerabilities,
# plus unmaintained and unsound crates anywhere in the tree (CI only blocks on those for direct
# dependencies, see backend/deny.toml). It skips any advisory ID already in an issue or PR title,
# open or closed. To triage an advisory that cannot be fixed here (e.g. deep in the Tauri tree),
# close its issue as "not planned" and it will not be reported again.
on:
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # issues for scheduled runs
  checks: write # check run for manual runs

concurrency:
  group: audit
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Prebuilt binary: otherwise audit-check compiles cargo-audit from source (minutes).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: backend
