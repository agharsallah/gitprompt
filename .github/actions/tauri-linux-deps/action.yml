name: Tauri Linux system libraries
description: What Tauri v2 (backend/apps/desktop) links against on Linux, so the whole workspace builds.
runs:
  using: composite
  steps:
    - name: Install the Tauri system libraries
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends --fix-missing \
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
          libayatana-appindicator3-dev librsvg2-dev build-essential pkg-config
