[package]
name = "gitprompt-tauri"
description = "Tauri v2 plugin: runs the GitPrompt daemon in-process, forwards live-update notices as events and exposes native commands over the Service facade."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# Tauri v2 plugins declare `links` so tauri-build can find the generated permission files;
# the part after `tauri-plugin-` is the permission prefix (`gitprompt:default`).
links = "tauri-plugin-gitprompt"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
gitprompt-core.workspace = true
gitprompt-store.workspace = true
gitprompt-server.workspace = true
tauri.workspace = true

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
