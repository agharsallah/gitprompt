# cargo-deny: advisories (known CVEs, unmaintained, unsound, yanked), licenses, duplicate
# versions and crate sources for the backend workspace. Run `just deny` locally; CI runs it on
# every push/PR that touches the backend and daily against the latest advisory database
# (.github/workflows/deps.yml). Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms GitPrompt ships on (CLI + Tauri desktop app). Without this the graph also
# pulls in every other platform's crates (wasm, android, ios, ...), which adds noise without adding coverage.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[output]
feature-depth = 1

[advisories]
# Every vulnerability fails. Unmaintained and unsound advisories also fail, but only for crates the
# workspace depends on directly: transitive ones (e.g. deep in the Tauri/GTK tree) cannot be
# fixed here, so they go to the daily report rather than blocking merges.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
# An ignore entry nobody needs any more fails the run, so the list stays honest.
unused-ignored-advisory = "deny"
# Each entry: { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not apply / what we wait for" }.
ignore = []

[licenses]
# GitPrompt is MIT. Permissive licenses only, plus MPL-2.0 (weak, file-level copyleft: fine to
# link as long as the MPL files themselves are not modified). Anything else needs a deliberate entry.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9
# An allowed license that no crate uses any more is just a warning.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Workspace crates are `publish = false`; their license is ours to decide.
ignore = true

[bans]
# Duplicate versions are reported but don't fail. The ones that exist today all come from upstream
# crates pinning an older major (listed in `skip` below, each with its puller), so the report starts
# clean and a newly added duplicate stands out. Before adding a skip, check that no bump of ours
# unifies it (`cargo tree -i <crate>@<version>`); drop an entry once upstream catches up.
multiple-versions = "warn"
# Wildcard versions (`*`) are denied, except for path dependencies inside the workspace.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # OpenSSL: the backend is pure rustls/native APIs; a C TLS stack sneaking in is a build and CVE burden.
    { crate = "openssl-sys", reason = "use rustls or platform TLS" },
]
skip = [
    # Tauri's macOS bridge.
    { crate = "base64@0.21", reason = "swift-rs 1.0.9 (latest, via tauri/tauri-utils); the rest of the tree is on 0.23" },
    # tauri-codegen 2.7.4 hashes assets with sha2 0.10; ours (gitprompt-insights) and rust-embed 8 use
    # sha2 0.11, so moving our pin back would not remove the pair. The whole RustCrypto 0.10 stack comes with it.
    { crate = "sha2@0.10", reason = "tauri-codegen 2.7.4 pins sha2 0.10; rust-embed 8 needs 0.11 like us" },
    { crate = "digest@0.10", reason = "sha2 0.10 (tauri-codegen)" },
    { crate = "block-buffer@0.10", reason = "digest 0.10 (tauri-codegen's sha2 0.10)" },
    { crate = "crypto-common@0.1", reason = "digest 0.10 (tauri-codegen's sha2 0.10)" },
    { crate = "cpufeatures@0.2", reason = "sha2 0.10 (tauri-codegen); sha2 0.11 and chacha20 use 0.3" },
    { crate = "getrandom@0.3", reason = "tauri 2.12 pins getrandom 0.3; rand 0.10, uuid and tempfile use 0.4 like us" },
    { crate = "dirs@6", reason = "auto-launch 0.6.0 (latest, via tauri-plugin-autostart); tauri and wry use dirs 7" },
    { crate = "indexmap@1", reason = "schemars 0.8 (via tauri-build/tauri-utils config schema)" },
    { crate = "hashbrown@0.12", reason = "indexmap 1 (schemars 0.8 via tauri-utils)" },
    { crate = "miniz_oxide@0.8", reason = "png 0.18.1 (latest, via tauri-codegen/muda/tray-icon) depends on it directly while its flate2 1.1.11 uses 0.9" },
    { crate = "roxmltree@0.20", reason = "fontconfig-parser 0.5.8 (latest, via resvg's fontdb); usvg 0.50 uses 0.21" },
    # Linux only: wry's webkit2gtk 2.0 / gtk-rs 0.18 stack and its build scripts and proc macros.
    { crate = "bitflags@1", reason = "webkit2gtk 2.0.2 and javascriptcore-rs 1.1 (wry on Linux)" },
    { crate = "thiserror@1", reason = "gtk-rs 0.18 (glib, gio, cairo-rs) via wry/tao on Linux" },
    { crate = "thiserror-impl@1", reason = "thiserror 1 (gtk-rs 0.18)" },
    { crate = "heck@0.4", reason = "glib-macros 0.18 (gtk-rs, wry on Linux)" },
    { crate = "syn@1", reason = "proc-macro-error 1.0.4 (glib-macros/gtk3-macros 0.18)" },
    { crate = "syn@2", reason = "most proc macros upstream (tauri-codegen/tauri-macros, ts-rs-macros, rust-embed-impl, gtk-rs) are still on syn 2 while serde/tokio/clap moved to syn 3" },
    { crate = "proc-macro-crate@1", reason = "gtk3-macros 0.18 (gtk-rs, wry on Linux)" },
    { crate = "proc-macro-crate@2", reason = "glib-macros 0.18 (gtk-rs, wry on Linux)" },
    { crate = "toml@0.8", reason = "system-deps 6 (build script of the gtk-rs 0.18 -sys crates); we and tauri use toml 1" },
    { crate = "serde_spanned@0.6", reason = "toml 0.8 / toml_edit 0.20 (system-deps 6, proc-macro-crate 2)" },
    { crate = "toml_datetime@0.6", reason = "toml 0.8 / toml_edit 0.19-0.20 (system-deps 6, proc-macro-crate 1-2)" },
    { crate = "toml_edit@0.19", reason = "proc-macro-crate 1 (gtk3-macros 0.18)" },
    { crate = "toml_edit@0.20", reason = "proc-macro-crate 2 (glib-macros 0.18) and toml 0.8 (system-deps 6)" },
    { crate = "winnow@0.5", reason = "toml_edit 0.19/0.20 (gtk-rs 0.18 build tooling)" },
]
skip-tree = []

[sources]
# crates.io only. A git or alternative-registry dependency must be added here on purpose.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
