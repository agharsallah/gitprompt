# cargo-deny: advisories (known CVEs, unmaintained, unsound, yanked), licenses, duplicate
# versions and crate sources for the backend workspace. Run `just deny` locally; CI runs it on
# every push/PR that touches the backend and daily against the latest advisory database
# (.github/workflows/deps.yml). Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms GitPrompt ships on (CLI + Tauri desktop app). Without this the graph also
# pulls in every other platform's crates (wasm, android, ios, ...), which adds noise without adding coverage.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[output]
feature-depth = 1

[advisories]
# Every vulnerability fails. Unmaintained and unsound advisories also fail, but only for crates the
# workspace depends on directly: transitive ones (e.g. deep in the Tauri/GTK tree) cannot be
# fixed here, so they go to the daily report rather than blocking merges.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
# An ignore entry nobody needs any more fails the run, so the list stays honest.
unused-ignored-advisory = "deny"
# Each entry: { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not apply / what we wait for" }.
ignore = []

[licenses]
# GitPrompt is MIT. Permissive licenses only, plus MPL-2.0 (weak, file-level copyleft: fine to
# link as long as the MPL files themselves are not modified). Anything else needs a deliberate entry.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9
# An allowed license that no crate uses any more is just a warning.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Workspace crates are `publish = false`; their license is ours to decide.
ignore = true

[bans]
# Duplicate versions are reported but don't fail: the Tauri tree alone carries several unavoidable
# pairs (windows-sys, bitflags, thiserror 1/2, ...). Newly added duplicates show up in the report.
multiple-versions = "warn"
# Wildcard versions (`*`) are denied, except for path dependencies inside the workspace.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # OpenSSL: the backend is pure rustls/native APIs; a C TLS stack sneaking in is a build and CVE burden.
    { crate = "openssl-sys", reason = "use rustls or platform TLS" },
]
skip = []
skip-tree = []

[sources]
# crates.io only. A git or alternative-registry dependency must be added here on purpose.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
