[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["agharsallah"]
# Internal crates: never published to crates.io by accident.
publish = false

[workspace.dependencies]
gitprompt-core = { path = "crates/gitprompt-core" }
gitprompt-store = { path = "crates/gitprompt-store" }
gitprompt-capture = { path = "crates/gitprompt-capture" }
gitprompt-insights = { path = "crates/gitprompt-insights" }
gitprompt-export = { path = "crates/gitprompt-export" }
gitprompt-server = { path = "crates/gitprompt-server" }
gitprompt-tauri = { path = "crates/gitprompt-tauri" }
gitprompt-dashboard = { path = "crates/gitprompt-dashboard" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
jiff = { version = "0.2", features = ["serde"] }
fancy-regex = "0.20"
getrandom = "0.4"
rusqlite = { version = "0.41", features = ["bundled", "serde_json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust-embed = "8"
sha2 = "0.11"
# Parsing only: `display` (TOML writing) is unused.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
glob = "0.3"
similar = "2"
# Charts rasterize text with system fonts; `raster-images` (JPEG/GIF/WebP decoders for <image>) is unused.
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Process memory and CPU for the health monitor; `system` only (no disks, networks, users).
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# TypeScript types of the HTTP API, generated into web/src/lib/api/generated (`just types`).
ts-rs = { version = "12", features = ["serde-json-impl", "indexmap-impl", "no-serde-warnings"] }
# desktop (Tauri v2)
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
# tests
tempfile = "3"
pretty_assertions = "1"
proptest = "1"
assert_cmd = "2"
insta = { version = "1", features = ["json", "redactions"] }
predicates = "3"

# Every member opts in with `[lints] workspace = true`. CI runs clippy with `-D warnings`,
# so each `warn` below is a hard gate there while staying a soft nudge in the editor.
# Test-only relaxations live in clippy.toml (`#[test]` / `#[cfg(test)]`) and in the
# `#![allow(..)]` header at the top of every integration-test file (tests/*.rs).
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"                # catch ignored Results and unpolled futures before CI
unreachable_pub = "warn"                # keeps each crate's public API small (modularity)
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints turned off on purpose (with why):
must_use_candidate = "allow"            # would put #[must_use] on ~200 plain getters; noise, not safety
missing_errors_doc = "allow"            # internal crates, not a published API
cast_precision_loss = "allow"           # counts → f64 for ratios; counts stay far below 2^53
similar_names = "allow"                 # flags pairs like `path`/`paths`; naming taste, not bugs
struct_excessive_bools = "allow"        # option/flag structs mirror API and CLI switches

# Panics and crashes
unwrap_used = "deny"                    # no unwrap outside tests
expect_used = "warn"                    # an expect needs a reason it cannot fail: #[expect(.., reason)]
panic = "deny"
indexing_slicing = "warn"               # a[i] can crash the program; use .get()
cast_possible_truncation = "warn"       # `as` silently drops high bits; use try_from
# Async correctness
await_holding_lock = "deny"             # std Mutex held across .await
large_futures = "warn"
# Leftovers
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"                   # stdout belongs to the CLI; it writes through a handle
allow_attributes_without_reason = "warn" # every #[allow]/#[expect] says why
# Performance (nursery lints with a good track record)
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"                    # unwrap_or(f()) builds the value even when unused

# Size: release builds are what ship (CLI + desktop app). Measured on the gitprompt CLI / desktop app
# (2026-11): thin LTO 14.6 / 21.2 MB → + strip symbols 12.5 / 17.7 MB → + fat LTO 11.7 / 16.7 MB,
# at ~1.5 min more release build time. `panic` stays "unwind" on purpose: a panicking request
# handler or tokio task must not take the whole daemon down.
# Debug builds keep line tables (readable backtraces) but not full debug info, which made up most
# of backend/target (tens of GB). Dependencies get none. Set `debug = true` locally to step through
# variables in a debugger. Stale builds are also pruned by `just target-guard` (justfile).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"   # panic backtraces lose function names; use the `profiling` profile to investigate

# `cargo build --profile profiling`: release code with symbols and line tables, for flamegraphs
# and readable backtraces.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
