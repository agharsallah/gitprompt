[package]
name = "gitprompt-desktop"
description = "GitPrompt desktop app (Tauri v2): the daemon in-process, the dashboard in a window, a tray icon."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tracing.workspace = true
gitprompt-core.workspace = true
gitprompt-server.workspace = true
gitprompt-tauri.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance.workspace = true
tauri-plugin-autostart.workspace = true

[build-dependencies]
tauri-build.workspace = true

[lints]
workspace = true
