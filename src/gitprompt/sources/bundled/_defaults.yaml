# Shared field mapping for every source. For each field, the first candidate path that holds a
# value wins. A spec's own `map` entries replace these per field. Unmapped payload keys are still
# stored (raw) and shown in the dashboard, so new metadata from a tool needs no change here.
map:
  event: [hook_event_name, hookEventName, event]
  prompt: [prompt, user_prompt, message.content, input, text]
  session_id: [session_id, sessionId, conversation_id, conversationId]
  prompt_id: [prompt_id, promptId, generation_id, messageId]
  cwd: [cwd, "workspace_roots[0]", "workspacePaths[0]"]
  model: [model, model_name, modelName]
  transcript_path: [transcript_path, transcriptPath]
  effort: [effort.level, effort]
  permission_mode: [permission_mode, permissionMode]
  agent_id: [agent_id, agentId]
  agent_type: [agent_type, agentType]
  tool_name: [tool_name, toolName]
  tool_use_id: [tool_use_id, toolUseId]

# Who produced a prompt (insights/origin.py, ADR-0010). Rules are tried in order and the first match
# wins: a spec's own `origin` rules first, then these. No match = `typed`. Text conditions look at the
# typed text, i.e. with the `injected` blocks below removed.
origin:
  - when: {field: agent_id}
    origin: subagent
  - when: {field: agent_type}
    origin: subagent
  - when: {text_regex: '/[\w:.-]+(\s|$)'}
    origin: slash_command

# Context blocks a tool adds before or after what the user typed: <tag ...>...</tag>. Only leading
# and trailing blocks are removed from the typed text. A spec's own tags are added to these.
injected: [system-reminder]

# Model calls (insights/derivations.py `_usage`): the events that each report one call, and where
# its model, tokens, cost and duration are. A spec's own `usage` replaces this one whole. These are
# Claude Code's telemetry `api_request` events, joined to its hook prompts by prompt id.
usage:
  events: [api_request]
  values:
    model: model
    input_tokens: input_tokens
    output_tokens: output_tokens
    cache_read_tokens: cache_read_tokens
    cache_creation_tokens: cache_creation_tokens
    cost_usd: cost_usd
    duration_ms: duration_ms
    query_source: query_source

# Payload keys the dashboard reads from the raw payload itself rather than through `map`, `usage` or
# a derivation -> where it shows them. A spec adds its own. (None today: what it reads, the turn
# timeline's durations and tool inputs, the derivations read too.)
shown: {}

# Payload keys the tools send that GitPrompt deliberately does not use -> why. Every key of a
# connector's fixtures must be mapped, derived, shown or listed here (tests/sources/test_field_coverage.py),
# so a field a tool update adds fails the tests until someone decides what it is for. A spec adds its own.
ignored:
  tool_response: >-
    A tool's output as the model saw it. Kept in the stored event (Events tab, clipped at 10,000
    characters) but not summarized: it can hold file contents, and Codex's has no exit code or duration.
  stop_hook_active: >-
    Whether another Stop hook already made the agent continue. It says nothing about the turn, and
    GitPrompt's own hooks never make it continue.
