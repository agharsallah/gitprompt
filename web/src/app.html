<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f5f4" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1413" />
		<script>
			// Apply a pinned theme before first paint (no flash). See lib/layout/ThemeToggle.svelte.
			try {
				var theme = localStorage.getItem('gitprompt-theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
