[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["agharsallah"]

[workspace.dependencies]
gitprompt-core = { path = "crates/gitprompt-core" }
gitprompt-store = { path = "crates/gitprompt-store" }
gitprompt-capture = { path = "crates/gitprompt-capture" }
gitprompt-insights = { path = "crates/gitprompt-insights" }
gitprompt-export = { path = "crates/gitprompt-export" }
gitprompt-server = { path = "crates/gitprompt-server" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
jiff = { version = "0.2", features = ["serde"] }
fancy-regex = "0.20"
rusqlite = { version = "0.41", features = ["bundled", "serde_json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
toml = "0.8"
glob = "0.3"
similar = "2"
# tests
tempfile = "3"
pretty_assertions = "1"
proptest = "1"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
