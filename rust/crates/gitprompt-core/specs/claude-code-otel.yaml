# Claude Code's documented OpenTelemetry export (https://code.claude.com/docs/en/monitoring-usage),
# sent to this machine only. Adds model, tokens, cost, API timings and tool decisions to each
# prompt: telemetry events carry prompt.id, the same value as the hooks' prompt_id.
# Separate from the hooks source so it can be connected (and reviewed) on its own.
id: claude-code-otel
name: Claude Code telemetry (model, tokens, cost)
part_of: claude-code
layer: Telemetry
summary: Model, tokens, cost and API timings for each prompt. Optional; needs the hooks layer for prompts.
detect: ["${CLAUDE_CONFIG_DIR:-~/.claude}"]
version_cmd: [claude, --version]
format: otlp
prompt_events: []  # attaches to prompts captured by the hooks source
# What this layer adds to the tool (the entrypoint tells programmatic runs apart: origin_markers).
capabilities: [model, usage, cost, session_metrics, origin_markers]

install:
  file: "${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json"
  merge:
    env:
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/json
      OTEL_EXPORTER_OTLP_ENDPOINT: "{{receiver}}/ingest/{{source}}"
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer {{token}}"
      OTEL_LOG_TOOL_DETAILS: "1"  # tool inputs, Bash commands, MCP/skill names on tool events
      OTEL_LOG_ASSISTANT_RESPONSES: "1"  # every response, not only the final one
      OTEL_METRICS_INCLUDE_VERSION: "true"
      OTEL_METRICS_INCLUDE_ENTRYPOINT: "true"
      OTEL_METRICS_INCLUDE_REPOSITORY: "true"
      # Not set: OTEL_LOG_USER_PROMPTS (the hooks source already has the prompt) and
      # OTEL_LOG_RAW_API_BODIES (whole API requests, including system prompts).

map:
  event: ["event.name", body]
  session_id: ["session.id"]
  prompt_id: ["prompt.id"]
  model: [model]

# If your organization (or you) already export Claude Code telemetry, GitPrompt leaves it alone.
policy:
  files:
    - "/Library/Application Support/ClaudeCode/managed-settings.json"
    - "/Library/Application Support/ClaudeCode/managed-settings.d/*.json"
    - "/etc/claude-code/managed-settings.json"
    - "/etc/claude-code/managed-settings.d/*.json"
    - "C:/Program Files/ClaudeCode/managed-settings.json"
    - "${CLAUDE_CONFIG_DIR:-~/.claude}/settings.json"
  block_if_set:
    - env.OTEL_EXPORTER_OTLP_ENDPOINT
    - env.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
    - env.OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
  warn_env: [CLAUDE_CODE_ENABLE_TELEMETRY, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_LOGS_EXPORTER, OTEL_METRICS_EXPORTER]

terms: >-
  Uses Claude Code's documented OpenTelemetry settings in your own user settings, with this machine
  as the only destination. Applies to sessions started after connecting. If telemetry is already
  configured by your organization or by you, GitPrompt does not change it. Nothing leaves this
  machine; disconnecting removes exactly the values GitPrompt added.

documented:
  "*": [session.id, app.version, app.entrypoint, organization.id, user.account_uuid, user.account_id, user.id, user.email, terminal.type, vcs.repository.url.full, vcs.owner.name, vcs.repository.name, vcs.provider.name, prompt.id, event.timestamp, event.sequence]
  user_prompt: [prompt_length, command_name, command_source, message.uuid]
  assistant_response: [response_length, response, model, request_id, message.uuid, query_source]
  tool_result: [tool_name, tool_use_id, request_id, success, duration_ms, error_type, decision_type, decision_source, tool_input_size_bytes, tool_result_size_bytes, mcp_server_scope, tool_parameters, tool_input]
  tool_decision: [tool_name, tool_use_id, request_id, decision, source, tool_source, classifier_verdict, classifier_category, permission_mode, tool_parameters]
  api_request: [model, cost_usd, cost_usd_micros, duration_ms, input_tokens, output_tokens, cache_read_tokens, cache_creation_tokens, cache_creation_5m_tokens, cache_creation_1h_tokens, request_id, client_request_id, speed, effort, query_source]
  api_error: [model, error, status_code, duration_ms, attempt, request_id, client_request_id, speed, effort, query_source]
  api_refusal: [model, request_id, query_source, speed, attempt, effort, server_fallback_hop, has_category, has_explanation, category]
  claude_code.session.count: [start_type, value]
  claude_code.lines_of_code.count: [type, model, value]
  claude_code.cost.usage: [model, query_source, speed, effort, value]
  claude_code.token.usage: [type, model, query_source, speed, effort, value]
  claude_code.code_edit_tool.decision: [tool_name, decision, source, language, value]
  claude_code.active_time.total: [type, value]
  claude_code.commit.count: [value]
  claude_code.pull_request.count: [value]

# Received but not stored: start-up and housekeeping events, repeated on every session start
# (about 40% of the database before this list), that no derivation or page reads.
# Listed on the Fields page. `gitprompt compact` removes rows stored before an event was listed here.
drop_events:
  hook_registered: Not stored. One event per configured hook at every start-up; describes your config, not your work.
  plugin_loaded: Not stored. One event per plugin at every start-up.
  hook_execution_*: Not stored. Start and end of every hook run, including GitPrompt's own; the hooks source already records each event.
  mcp_server_connection: Not stored. MCP server connect and disconnect at every start-up.
  managed_settings_resolved: Not stored. Settings resolution at start-up.
  retention_sweep: Not stored. Claude Code's own housekeeping run.

not_captured:
  user_prompt text: OTEL_LOG_USER_PROMPTS is left off; the hooks source already captures the prompt.
  api_request_body / api_response_body: OTEL_LOG_RAW_API_BODIES is left off; it holds whole API requests including system prompts.
  traces: The traces exporter (beta) is left off.
